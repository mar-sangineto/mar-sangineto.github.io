<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marina Sangineto Jucá</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #F5F6F3;
    --surface: #FFFFFF;
    --surface-2: #EDEFEA;
    --ink: #12181D;
    --ink-soft: #4E5A61;
    --ink-faint: #8B959B;
    --line: #DBDED7;
    --accent: #0A6E93;
    --accent-ink: #FFFFFF;
    --accent-glow: rgba(10,110,147,0.12);
    --track: #C9CFC7;
    --shadow: rgba(20,30,35,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0A0F13;
      --surface: #10171D;
      --surface-2: #161F26;
      --ink: #E9EEF1;
      --ink-soft: #A7B3B9;
      --ink-faint: #6B767C;
      --line: #223039;
      --accent: #4FD8FF;
      --accent-ink: #06222C;
      --accent-glow: rgba(79,216,255,0.14);
      --track: #24343D;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #0A0F13;
    --surface: #10171D;
    --surface-2: #161F26;
    --ink: #E9EEF1;
    --ink-soft: #A7B3B9;
    --ink-faint: #6B767C;
    --line: #223039;
    --accent: #4FD8FF;
    --accent-ink: #06222C;
    --accent-glow: rgba(79,216,255,0.14);
    --track: #24343D;
    --shadow: rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  a{ color:inherit; }

  ::selection{ background:var(--accent-glow); color:var(--ink); }

  /* ---------- decorative track lines ---------- */
  .tracks{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .tracks svg{ width:100%; height:100%; display:block; }
  .tracks path{
    fill:none; stroke:var(--track); stroke-width:1;
  }
  .tracks .hit{ stroke:var(--accent); opacity:0.55; }

  /* ---------- header / nav ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    transform:translateY(0);
    transition:transform .28s ease;
  }
  header.site.is-hidden{ transform:translateY(-100%); }
  .nav-wrap{
    max-width:1080px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.05rem;
    letter-spacing:0.01em; white-space:nowrap;
  }
  .brand .dot{ color:var(--accent); font-weight:400; }
  h1.name .dot{ color:var(--accent); font-weight:500; }
  nav.links{ display:flex; gap:22px; flex-wrap:wrap; }
  nav.links a{
    text-decoration:none; font-size:0.86rem; color:var(--ink-soft);
    letter-spacing:0.02em; text-transform:uppercase; font-weight:500;
    padding:4px 2px; border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.links a:hover{ color:var(--ink); border-color:var(--accent); }
  .nav-tools{ display:flex; align-items:center; gap:10px; }
  .toggle{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; letter-spacing:0.04em;
    background:var(--surface); color:var(--ink-soft); border:1px solid var(--line);
    border-radius:999px; padding:6px 4px; display:flex; gap:2px; cursor:pointer;
  }
  .toggle button{
    font-family:inherit; font-size:inherit; border:none; background:none; color:inherit;
    padding:3px 9px; border-radius:999px; cursor:pointer;
  }
  .toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .burger{ display:none; }

  @media (max-width:760px){
    nav.links{ display:none; }
    .burger{ display:block; background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 10px; font-size:1rem; cursor:pointer; }
    nav.links.open{ display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 28px; gap:14px; }
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero-inner{
    position:relative; z-index:1;
    max-width:1080px; margin:0 auto; padding:88px 28px 72px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); margin:0 0 18px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:""; width:26px; height:1px; background:var(--accent); display:inline-block;
  }
  h1.name{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600;
    font-size:clamp(2.4rem, 5.6vw, 4.1rem); line-height:1.04; margin:0 0 22px;
    text-wrap:balance; letter-spacing:-0.01em;
  }
  .lede{
    max-width:62ch; font-size:1.12rem; color:var(--ink-soft); margin:0 0 32px;
  }
  .lede em{ font-style:normal; color:var(--ink); border-bottom:1.5px solid var(--accent); }

  .tagrow{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:36px; }
  .tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.03em;
    border:1px solid var(--line); color:var(--ink-soft); padding:6px 12px; border-radius:999px;
    background:var(--surface);
  }

  .contact-row{ display:flex; flex-wrap:wrap; gap:14px; }
  .contact-row a{
    display:inline-flex; align-items:center; gap:8px;
    text-decoration:none; font-size:0.92rem; font-weight:500;
    padding:10px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .contact-row a:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 18px var(--shadow); }
  .contact-row a.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .contact-row svg{ width:16px; height:16px; flex:none; }
  .contact-row a img.email-img{ display:block; height:14px; width:auto; }

  /* ---------- sections ---------- */
  main{ max-width:1080px; margin:0 auto; padding:0 28px; }
  section{ padding:76px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }

  .section-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:44px; }
  .section-num{ font-family:'IBM Plex Mono', monospace; color:var(--accent); font-size:0.85rem; }
  h2.section-title{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.9rem; margin:0;
    text-wrap:balance;
  }
  .section-sub{ color:var(--ink-faint); font-size:0.95rem; margin:6px 0 0; }

  p.summary{ max-width:70ch; color:var(--ink-soft); font-size:1.02rem; }

  /* timeline (education + research) */
  .timeline{ position:relative; }
  .timeline::before{
    content:""; position:absolute; left:7px; top:6px; bottom:6px; width:1px; background:var(--line);
  }
  .t-item{ position:relative; padding:0 0 40px 34px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-item::before{
    content:""; position:absolute; left:0px; top:6px; width:15px; height:15px; border-radius:50%;
    background:var(--surface); border:2px solid var(--accent);
  }
  .t-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 20px; margin-bottom:4px; }
  .t-org{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.14rem; }
  .t-date{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--accent); white-space:nowrap; }
  .t-role{ color:var(--ink-soft); font-style:italic; font-size:0.96rem; margin-bottom:10px; }
  .t-loc{ color:var(--ink-faint); font-size:0.82rem; margin-left:8px; font-style:normal; }
  ul.bullets{ margin:0; padding-left:1.1em; color:var(--ink-soft); font-size:0.96rem; }
  ul.bullets li{ margin-bottom:6px; }
  ul.bullets li::marker{ color:var(--accent); }

  /* projects grid */
  .grid-projects{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 22px 20px;
    display:flex; flex-direction:column; gap:10px; transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 10px 24px var(--shadow); }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-title{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.06rem; }
  .card-date{ font-family:'IBM Plex Mono', monospace; font-size:0.74rem; color:var(--ink-faint); white-space:nowrap; }
  .card p{ margin:0; color:var(--ink-soft); font-size:0.92rem; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:8px; }
  .chip{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--accent); background:var(--accent-glow); padding:3px 9px; border-radius:999px; }
  .card-link{ font-size:0.82rem; color:var(--accent); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:4px; }
  .card-link:hover{ text-decoration:underline; }
  button.card-link{ background:none; border:none; padding:0; cursor:pointer; font-family:inherit; text-align:left; }
  .card.featured{ border-color:var(--accent); background:linear-gradient(180deg, var(--accent-glow), var(--surface) 70%); }
  .card-kicker{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); }

  /* inline case-study trigger inside timeline bullets */
  .case-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.03em;
    color:var(--accent); background:var(--accent-glow); border:1px solid transparent;
    padding:5px 12px; border-radius:999px; cursor:pointer; transition:border-color .15s;
  }
  .case-btn:hover, .case-btn:focus-visible{ border-color:var(--accent); outline:none; }

  /* expandable fronts */
  .fronts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; align-items:stretch; grid-auto-flow:dense; }
  details.front[open]{ grid-column:1 / -1; }
  details.front:not([open]) summary{ height:100%; }
  details.front{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    transition:border-color .15s, box-shadow .15s;
  }
  details.front[open]{ border-color:var(--accent); box-shadow:0 10px 24px var(--shadow); }
  details.front summary{
    list-style:none; cursor:pointer; padding:16px 18px; display:grid;
    grid-template-columns:auto 1fr; grid-template-rows:auto 1fr auto; gap:6px 10px; align-items:start;
  }
  details.front summary::-webkit-details-marker{ display:none; }
  details.front summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
  .front-num{ font-family:'IBM Plex Mono', monospace; color:var(--accent); font-size:0.85rem; padding-top:2px; }
  .front-title{ font-weight:600; font-size:1.02rem; }
  .front-short{ grid-column:2; grid-row:2; color:var(--ink-soft); font-size:0.92rem; }
  .front-toggle{
    grid-row:3; grid-column:2; justify-self:start; margin-top:6px; font-family:'IBM Plex Mono', monospace; font-size:0.74rem;
    color:var(--accent); background:var(--accent-glow); border-radius:999px; padding:4px 10px; white-space:nowrap;
  }
  .front-toggle .less{ display:none; }
  details.front[open] .front-toggle .more{ display:none; }
  details.front[open] .front-toggle .less{ display:inline; }
  .front-body{ border-top:1px solid var(--line); margin:0 20px; padding:0 0 20px; }
  .front-body h4{ font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.08em; color:var(--accent); margin:16px 0 6px; }
  .front-body p{ margin:0; color:var(--ink-soft); font-size:0.94rem; max-width:72ch; }

  .front-hint{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem !important; color:var(--ink-faint) !important; }
  .front-body .case-list{ margin-top:10px; font-size:0.92rem; }
  a.card-clickable{ text-decoration:none; color:inherit; cursor:pointer; }
  .card-kicker{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-arrow{ font-family:'IBM Plex Sans', sans-serif; font-size:1.1rem; color:var(--accent); transition:transform .15s; }
  a.card-clickable:hover .card-arrow{ transform:translateX(4px); }
  a.card-clickable:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  @media (max-width:680px){
    details.front summary{ padding:14px; }
    .front-body{ margin:0 14px; }
  }
  /* ---------- case-study dialog ---------- */
  dialog.case{
    width:min(900px, calc(100vw - 32px)); max-height:calc(100dvh - 48px);
    padding:0; border:1px solid var(--line); border-radius:14px;
    background:var(--bg); color:var(--ink); box-shadow:0 24px 64px var(--shadow);
  }
  dialog.case::backdrop{ background:rgba(6,12,16,0.55); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); }
  body.dialog-open{ overflow:hidden; }
  .case-top{
    position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    padding:22px 28px 16px; background:color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .case-top h2{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.5rem; line-height:1.2; margin:4px 0 0; text-wrap:balance; }
  .case-close{
    flex:none; background:var(--surface); border:1px solid var(--line); color:var(--ink);
    width:36px; height:36px; border-radius:8px; font-size:1.1rem; cursor:pointer;
  }
  .case-close:hover{ border-color:var(--accent); }
  .case-body{ padding:8px 28px 32px; }
  .case-body h3{ font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.08em; color:var(--accent); margin:30px 0 12px; }
  .case-body p{ color:var(--ink-soft); margin:0 0 12px; max-width:72ch; }
  .case-body p strong{ color:var(--ink); font-weight:600; }
  .case-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:12px; margin-top:20px; }
  .case-stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .case-stat b{ display:block; font-family:'IBM Plex Serif', Georgia, serif; font-size:1.55rem; color:var(--accent); line-height:1.15; }
  .case-stat span{ font-size:0.84rem; color:var(--ink-soft); }
  .case-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:12px; }
  .case-box{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .case-box b{ display:block; font-weight:600; margin-bottom:4px; font-size:0.95rem; }
  .case-box b .mono{ color:var(--accent); font-weight:500; margin-right:6px; }
  .case-box p{ font-size:0.88rem; margin:0; }
  .case-steps{ display:flex; align-items:flex-end; gap:8px; margin-bottom:6px; }
  .case-step{ flex:1; height:var(--h, auto); border-radius:10px; padding:12px; background:var(--surface-2); border:1px solid var(--line); font-size:0.82rem; color:var(--ink-soft); }
  .case-step b{ display:block; color:var(--ink); font-size:0.92rem; margin-bottom:4px; }
  .case-step:last-child{ border-color:var(--accent); background:var(--accent-glow); }
  .case-fig{ margin:4px 0 0; }
  .case-fig img{ width:100%; height:auto; display:block; border-radius:10px; border:1px solid var(--line); background:#1e1e1e; }
  .case-fig figcaption{ font-size:0.8rem; color:var(--ink-faint); margin-top:8px; }
  .case-list{ margin:0; padding-left:1.1em; color:var(--ink-soft); max-width:72ch; }
  .case-list li{ margin-bottom:8px; }
  .case-list li::marker{ color:var(--accent); }
  .case-list strong{ color:var(--ink); font-weight:600; }
  .case-two{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .case-two ul{ margin:0; padding-left:1.1em; color:var(--ink-soft); font-size:0.9rem; }
  .case-two li{ margin-bottom:6px; }
  .case-two li::marker{ color:var(--accent); }
  .case-note{ font-size:0.84rem; color:var(--ink-faint); border-left:2px solid var(--accent); padding-left:12px; margin-top:18px; }
  .case-body > p + .case-note{ margin-top:8px; }
  @media (max-width:680px){
    .case-top{ padding:16px 18px 12px; }
    .case-top h2{ font-size:1.2rem; }
    .case-body{ padding:4px 18px 24px; }
    .case-steps{ flex-direction:column; align-items:stretch; }
    .case-step{ height:auto; }
    .case-two{ grid-template-columns:1fr; }
  }

  /* experience list */
  .exp-item{ display:grid; grid-template-columns:180px 1fr; gap:20px; padding:20px 0; border-top:1px solid var(--line); }
  .exp-item:first-child{ border-top:none; }
  .exp-date{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--ink-faint); }
  .exp-org{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.05rem; }
  .exp-role{ color:var(--ink-soft); font-style:italic; font-size:0.92rem; margin-bottom:8px; }
  @media (max-width:600px){ .exp-item{ grid-template-columns:1fr; gap:6px; } }

  /* skills */
  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:28px 32px; }
  .skill-group h3{ font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.08em; color:var(--accent); margin:0 0 12px; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .skill-tags .chip{ color:var(--ink-soft); background:var(--surface-2); }

  /* awards */
  .awards-list{ display:grid; gap:12px; }
  .award{ display:flex; gap:14px; align-items:baseline; padding:12px 0; border-top:1px solid var(--line); }
  .award:first-child{ border-top:none; }
  .award-medal{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--accent-ink); background:var(--accent); border-radius:5px; padding:2px 8px; white-space:nowrap; }
  .award-name{ font-weight:500; }
  .award-detail{ color:var(--ink-faint); font-size:0.88rem; }

  /* languages + interests */
  .lang-interest{ display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  @media (max-width:640px){ .lang-interest{ grid-template-columns:1fr; } }
  .li-row{ display:flex; justify-content:space-between; border-top:1px solid var(--line); padding:10px 0; font-size:0.94rem; }
  .li-row:first-child{ border-top:none; }
  .li-row span:last-child{ color:var(--ink-faint); }

  /* footer */
  footer{ padding:56px 28px 40px; text-align:center; }
  footer .contact-row{ justify-content:center; margin-bottom:22px; }
  footer p{ color:var(--ink-faint); font-size:0.82rem; margin:0; font-family:'IBM Plex Mono', monospace; }

  .reveal{ opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:none; }

  /* ---------- mobile ---------- */
  /* overflow-x is scoped to content wrappers, not html/body — putting it on
     body breaks position:sticky on the header in several mobile browsers */
  main, footer{ overflow-x:hidden; }
  @media (max-width:680px){
    body{ font-size:15px; }
    .nav-wrap{ padding:12px 18px; }
    .brand{ font-size:0.95rem; }
    nav.links.open{ padding:14px 18px; }

    .hero-inner{ padding:52px 18px 44px; }
    .eyebrow{ font-size:0.7rem; gap:8px; margin-bottom:14px; }
    h1.name{ margin-bottom:16px; }
    .lede{ font-size:1rem; margin-bottom:24px; }
    .tagrow{ margin-bottom:26px; gap:7px; }
    .tag{ font-size:0.72rem; padding:5px 10px; }
    .contact-row{ gap:10px; }
    .contact-row a{ padding:10px 14px; font-size:0.88rem; flex:1 1 auto; justify-content:center; }

    main{ padding:0 18px; }
    section{ padding:52px 0; }

  // ---------- helpers ----------
  function t(field, lang){
    if (field == null) return "";
    if (typeof field === "string") return field;
    return field[lang] || field.en || "";
  }
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  var state = { lang: "en" };

    if (saved === "en" || saved === "pt") state.lang = saved;

  function applyStaticI18n(){
    var lang = state.lang;
    document.documentElement.setAttribute("lang", lang);
    document.querySelectorAll("[data-i18n]").forEach(function(node){
      var key = node.getAttribute("data-i18n");
      node.textContent = I18N[lang][key] || "";
    });
    document.querySelectorAll("[data-i18n-html]").forEach(function(node){
      var key = node.getAttribute("data-i18n-html");
      node.innerHTML = I18N[lang][key] || "";
    });
    document.querySelectorAll(".toggle button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });
  }

      node.appendChild(head);
      if (item.role) node.appendChild(el("div","t-role", t(item.role, state.lang)));
      if (item.bullets && item.bullets.length){
        var ul = el("ul","bullets");

      }
      if (b.steps){
        var s = el("div","case-steps");
        b.steps.forEach(function(x, i){
          var st = el("div","case-step");
          st.style.setProperty("--h", (122 + i*26) + "px");
          st.appendChild(el("b", null, t(x.t, lang)));
          st.appendChild(document.createTextNode(t(x.d, lang)));
          s.appendChild(st);
        });
        body.appendChild(s);
      }
      if (b.fig){
        var fig = el("figure","case-fig");
        var img = document.createElement("img");
        img.src = b.fig.src; img.alt = t(b.fig.alt, lang); img.loading = "lazy";
        img.width = 1400; img.height = 830;
        fig.appendChild(img);
        fig.appendChild(el("figcaption", null, t(b.fig.cap, lang)));
        body.appendChild(fig);
      }
      if (b.stats){
        var sg = el("div","case-stats");
        b.stats.forEach(function(x){
          var c = el("div","case-stat");
          c.appendChild(el("b", null, t(x.b, lang)));
          c.appendChild(el("span", null, t(x.s, lang)));
          sg.appendChild(c);
        });
        body.appendChild(sg);
      }
      if (b.two){
        var tw = el("div","case-two");
        b.two.forEach(function(col){
          var box = el("div","case-box");
          box.appendChild(el("b", null, t(col.t, lang)));
          var ul = el("ul");
          col.li.forEach(function(li){ ul.appendChild(el("li", null, t(li, lang))); });
          box.appendChild(ul);
          tw.appendChild(box);
        });
        body.appendChild(tw);
      }
      if (b.after) body.appendChild(el("p","case-note", t(b.after, lang)));
    });
  }

  var caseDialog = document.getElementById("caseDialog");
  function openCase(){
    renderCase();
    if (typeof caseDialog.showModal === "function") caseDialog.showModal();
    else caseDialog.setAttribute("open", "");
    document.body.classList.add("dialog-open");
    caseDialog.scrollTop = 0;
    try { history.replaceState(null, "", "#case-agents"); } catch(e){}
  }
  function closeCase(){
    if (caseDialog.open){
      if (typeof caseDialog.close === "function") caseDialog.close();
      else caseDialog.removeAttribute("open");
    }
  }
  caseDialog.addEventListener("close", function(){
    document.body.classList.remove("dialog-open");
    if (location.hash === "#case-agents"){
      try { history.replaceState(null, "", location.pathname + location.search); } catch(e){}
    }
  });
  document.getElementById("caseClose").addEventListener("click", closeCase);
  caseDialog.addEventListener("click", function(e){ if (e.target === caseDialog) closeCase(); });

  function renderAll(){
    applyStaticI18n();
    renderTags();
    renderTimeline("educationTimeline", EDUCATION);
    renderTimeline("researchTimeline", RESEARCH);
    renderProjects();
    renderExperience();
    renderSkills();
    renderAwards();
    if (caseDialog.open) renderCase();
    observeReveals();
  }

  document.getElementById("langToggle").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-lang]");
    if (!btn) return;
    state.lang = btn.getAttribute("data-lang");
    try { localStorage.setItem("portfolio-lang", state.lang); } catch(err){}
    renderAll();
  });

  document.getElementById("burgerBtn").addEventListener("click", function(){
    document.getElementById("navLinks").classList.toggle("open");
  });
  document.querySelectorAll("#navLinks a").forEach(function(a){
    a.addEventListener("click", function(){ document.getElementById("navLinks").classList.remove("open"); });
  });

  // ---------- header: hide on scroll-down, reappear on any scroll-up ----------
  // Keeps the nav one gesture away from anywhere on the page, instead of
  // requiring a full scroll back to the very top.
  (function(){
    var header = document.querySelector("header.site");
    var lastY = window.scrollY;
    var ticking = false;
    var revealZone = 72; // always show header near the very top

    function onScroll(){
      var y = window.scrollY;
      var navOpen = document.getElementById("navLinks").classList.contains("open");
      if (navOpen){
        // never hide the header while the mobile menu is open
        header.classList.remove("is-hidden");
      } else if (y <= revealZone){
        header.classList.remove("is-hidden");
      } else if (y > lastY){
        header.classList.add("is-hidden");
      } else if (y < lastY){
        header.classList.remove("is-hidden");
      }
      lastY = y;
      ticking = false;
    }

    window.addEventListener("scroll", function(){
      if (!ticking){
        window.requestAnimationFrame(onScroll);
        ticking = true;
      }
    }, { passive:true });
  })();

  function observeReveals(){
    var items = document.querySelectorAll(".reveal:not(.in)");
    if (!("IntersectionObserver" in window)){
      items.forEach(function(i){ i.classList.add("in"); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          entry.target.classList.add("in");
          io.unobserve(entry.target);
        }
      });
    }, { threshold:0.12 });
    items.forEach(function(i){ io.observe(i); });
  }

  // ---------- spam-resistant email buttons ----------
  // Address is assembled at runtime (not present as static text/href in the
  // markup) and rendered as a canvas image, so simple bots scraping HTML
  // for mailto: links or email-shaped text come up empty.
  function initEmailButtons(){
    var userPart = ["m","a","r",".","s","a","n","g","i","n","e","t","o"].join("");
    var domainPart = ["g","m","a","i","l",".","c","o","m"].join("");
    var address = userPart + "@" + domainPart;

    function drawEmailImage(colorVar, fontWeight, fontSize){
      var scale = Math.max(window.devicePixelRatio || 1, 2);
      var font = fontWeight + " " + fontSize + "px 'IBM Plex Sans', sans-serif";
      var probe = document.createElement("canvas").getContext("2d");
      probe.font = font;
      var w = Math.ceil(probe.measureText(address).width) + 2;
      var h = Math.ceil(fontSize * 1.3);
      var canvas = document.createElement("canvas");
      canvas.width = w * scale; canvas.height = h * scale;
      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.font = font;
      ctx.textBaseline = "middle";
      var color = getComputedStyle(document.documentElement).getPropertyValue(colorVar).trim() || "#ffffff";
      ctx.fillStyle = color;
      ctx.fillText(address, 0, h/2);
      var img = document.createElement("img");
      img.className = "email-img";
      img.src = canvas.toDataURL();
      img.alt = "";
      img.width = w; img.height = h;
      return img;
    }

    function wire(btnId, colorVar, weight, size){
      var btn = document.getElementById(btnId);
      if (!btn) return;
      btn.appendChild(drawEmailImage(colorVar, weight, size));
      btn.addEventListener("click", function(e){
        e.preventDefault();
        window.location.href = "mailto:" + address;
      });
    }

    wire("emailBtnHero", "--accent-ink", 500, 15);
    wire("emailBtnFooter", "--accent-ink", 600, 15);
  }

  renderAll();
  initEmailButtons();
  if (location.hash === "#case-agents") openCase();
})();
</script>
