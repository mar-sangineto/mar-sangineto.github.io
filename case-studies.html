<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Studies · Marina Sangineto Jucá</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #F5F6F3;
    --surface: #FFFFFF;
    --surface-2: #EDEFEA;
    --ink: #12181D;
    --ink-soft: #4E5A61;
    --ink-faint: #8B959B;
    --line: #DBDED7;
    --accent: #0A6E93;
    --accent-ink: #FFFFFF;
    --accent-glow: rgba(10,110,147,0.12);
    --track: #C9CFC7;
    --shadow: rgba(20,30,35,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #0A0F13;
      --surface: #10171D;
      --surface-2: #161F26;
      --ink: #E9EEF1;
      --ink-soft: #A7B3B9;
      --ink-faint: #6B767C;
      --line: #223039;
      --accent: #4FD8FF;
      --accent-ink: #06222C;
      --accent-glow: rgba(79,216,255,0.14);
      --track: #24343D;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #0A0F13;
    --surface: #10171D;
    --surface-2: #161F26;
    --ink: #E9EEF1;
    --ink-soft: #A7B3B9;
    --ink-faint: #6B767C;
    --line: #223039;
    --accent: #4FD8FF;
    --accent-ink: #06222C;
    --accent-glow: rgba(79,216,255,0.14);
    --track: #24343D;
    --shadow: rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; }

  a{ color:inherit; }

  ::selection{ background:var(--accent-glow); color:var(--ink); }

  /* ---------- decorative track lines ---------- */
  .tracks{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0;
  }
  .tracks svg{ width:100%; height:100%; display:block; }
  .tracks path{
    fill:none; stroke:var(--track); stroke-width:1;
  }
  .tracks .hit{ stroke:var(--accent); opacity:0.55; }

  /* ---------- header / nav ---------- */
  header.site{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    transform:translateY(0);
    transition:transform .28s ease;
  }
  header.site.is-hidden{ transform:translateY(-100%); }
  .nav-wrap{
    max-width:1080px; margin:0 auto; padding:14px 28px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.05rem;
    letter-spacing:0.01em; white-space:nowrap;
  }
  .brand .dot{ color:var(--accent); font-weight:400; }
  h1.name .dot{ color:var(--accent); font-weight:500; }
  nav.links{ display:flex; gap:22px; flex-wrap:wrap; }
  nav.links a{
    text-decoration:none; font-size:0.86rem; color:var(--ink-soft);
    letter-spacing:0.02em; text-transform:uppercase; font-weight:500;
    padding:4px 2px; border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.links a:hover{ color:var(--ink); border-color:var(--accent); }
  .nav-tools{ display:flex; align-items:center; gap:10px; }
  .toggle{
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem; letter-spacing:0.04em;
    background:var(--surface); color:var(--ink-soft); border:1px solid var(--line);
    border-radius:999px; padding:6px 4px; display:flex; gap:2px; cursor:pointer;
  }
  .toggle button{
    font-family:inherit; font-size:inherit; border:none; background:none; color:inherit;
    padding:3px 9px; border-radius:999px; cursor:pointer;
  }
  .toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .burger{ display:none; }

  @media (max-width:760px){
    nav.links{ display:none; }
    .burger{ display:block; background:none; border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:6px 10px; font-size:1rem; cursor:pointer; }
    nav.links.open{ display:flex; flex-direction:column; position:absolute; top:100%; left:0; right:0; background:var(--bg); border-bottom:1px solid var(--line); padding:14px 28px; gap:14px; }
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero-inner{
    position:relative; z-index:1;
    max-width:1080px; margin:0 auto; padding:88px 28px 72px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--accent); margin:0 0 18px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{
    content:""; width:26px; height:1px; background:var(--accent); display:inline-block;
  }
  h1.name{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600;
    font-size:clamp(2.4rem, 5.6vw, 4.1rem); line-height:1.04; margin:0 0 22px;
    text-wrap:balance; letter-spacing:-0.01em;
  }
  .lede{
    max-width:62ch; font-size:1.12rem; color:var(--ink-soft); margin:0 0 32px;
  }
  .lede em{ font-style:normal; color:var(--ink); border-bottom:1.5px solid var(--accent); }

  .tagrow{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:36px; }
  .tag{
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.03em;
    border:1px solid var(--line); color:var(--ink-soft); padding:6px 12px; border-radius:999px;
    background:var(--surface);
  }

  .contact-row{ display:flex; flex-wrap:wrap; gap:14px; }
  .contact-row a{
    display:inline-flex; align-items:center; gap:8px;
    text-decoration:none; font-size:0.92rem; font-weight:500;
    padding:10px 16px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .contact-row a:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:0 6px 18px var(--shadow); }
  .contact-row a.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .contact-row svg{ width:16px; height:16px; flex:none; }
  .contact-row a img.email-img{ display:block; height:14px; width:auto; }

  /* ---------- sections ---------- */
  main{ max-width:1080px; margin:0 auto; padding:0 28px; }
  section{ padding:76px 0; border-bottom:1px solid var(--line); }
  section:last-of-type{ border-bottom:none; }

  .section-head{ display:flex; align-items:baseline; gap:16px; margin-bottom:44px; }
  .section-num{ font-family:'IBM Plex Mono', monospace; color:var(--accent); font-size:0.85rem; }
  h2.section-title{
    font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.9rem; margin:0;
    text-wrap:balance;
  }
  .section-sub{ color:var(--ink-faint); font-size:0.95rem; margin:6px 0 0; }

  p.summary{ max-width:70ch; color:var(--ink-soft); font-size:1.02rem; }

  /* timeline (education + research) */
  .timeline{ position:relative; }
  .timeline::before{
    content:""; position:absolute; left:7px; top:6px; bottom:6px; width:1px; background:var(--line);
  }
  .t-item{ position:relative; padding:0 0 40px 34px; }
  .t-item:last-child{ padding-bottom:0; }
  .t-item::before{
    content:""; position:absolute; left:0px; top:6px; width:15px; height:15px; border-radius:50%;
    background:var(--surface); border:2px solid var(--accent);
  }
  .t-head{ display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 20px; margin-bottom:4px; }
  .t-org{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.14rem; }
  .t-date{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--accent); white-space:nowrap; }
  .t-role{ color:var(--ink-soft); font-style:italic; font-size:0.96rem; margin-bottom:10px; }
  .t-loc{ color:var(--ink-faint); font-size:0.82rem; margin-left:8px; font-style:normal; }
  ul.bullets{ margin:0; padding-left:1.1em; color:var(--ink-soft); font-size:0.96rem; }
  ul.bullets li{ margin-bottom:6px; }
  ul.bullets li::marker{ color:var(--accent); }

  /* projects grid */
  .grid-projects{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 22px 20px;
    display:flex; flex-direction:column; gap:10px; transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover{ border-color:var(--accent); transform:translateY(-2px); box-shadow:0 10px 24px var(--shadow); }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-title{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.06rem; }
  .card-date{ font-family:'IBM Plex Mono', monospace; font-size:0.74rem; color:var(--ink-faint); white-space:nowrap; }
  .card p{ margin:0; color:var(--ink-soft); font-size:0.92rem; }
  .card-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:8px; }
  .chip{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; color:var(--accent); background:var(--accent-glow); padding:3px 9px; border-radius:999px; }
  .card-link{ font-size:0.82rem; color:var(--accent); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:4px; }
  .card-link:hover{ text-decoration:underline; }
  button.card-link{ background:none; border:none; padding:0; cursor:pointer; font-family:inherit; text-align:left; }
  .card.featured{ border-color:var(--accent); background:linear-gradient(180deg, var(--accent-glow), var(--surface) 70%); }
  .card-kicker{ font-family:'IBM Plex Mono', monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); }

  /* inline case-study trigger inside timeline bullets */
  .case-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:8px;
    font-family:'IBM Plex Mono', monospace; font-size:0.78rem; letter-spacing:0.03em;
    color:var(--accent); background:var(--accent-glow); border:1px solid transparent;
    padding:5px 12px; border-radius:999px; cursor:pointer; transition:border-color .15s;
  }
  .case-btn:hover, .case-btn:focus-visible{ border-color:var(--accent); outline:none; }

  /* experience list */
  .exp-item{ display:grid; grid-template-columns:180px 1fr; gap:20px; padding:20px 0; border-top:1px solid var(--line); }
  .exp-item:first-child{ border-top:none; }
  .exp-date{ font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--ink-faint); }
  .exp-org{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.05rem; }
  .exp-role{ color:var(--ink-soft); font-style:italic; font-size:0.92rem; margin-bottom:8px; }
  @media (max-width:600px){ .exp-item{ grid-template-columns:1fr; gap:6px; } }

  /* skills */
  .skills-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:28px 32px; }
  .skill-group h3{ font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:0.78rem; letter-spacing:0.08em; color:var(--accent); margin:0 0 12px; }
  .skill-tags{ display:flex; flex-wrap:wrap; gap:7px; }
  .skill-tags .chip{ color:var(--ink-soft); background:var(--surface-2); }

  /* awards */
  .awards-list{ display:grid; gap:12px; }
  .award{ display:flex; gap:14px; align-items:baseline; padding:12px 0; border-top:1px solid var(--line); }
  .award:first-child{ border-top:none; }
  .award-medal{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--accent-ink); background:var(--accent); border-radius:5px; padding:2px 8px; white-space:nowrap; }
  .award-name{ font-weight:500; }
  .award-detail{ color:var(--ink-faint); font-size:0.88rem; }

  /* languages + interests */
  .lang-interest{ display:grid; grid-template-columns:1fr 1fr; gap:40px; }
  @media (max-width:640px){ .lang-interest{ grid-template-columns:1fr; } }
  .li-row{ display:flex; justify-content:space-between; border-top:1px solid var(--line); padding:10px 0; font-size:0.94rem; }
  .li-row:first-child{ border-top:none; }
  .li-row span:last-child{ color:var(--ink-faint); }

  /* footer */
  footer{ padding:56px 28px 40px; text-align:center; }
  footer .contact-row{ justify-content:center; margin-bottom:22px; }
  footer p{ color:var(--ink-faint); font-size:0.82rem; margin:0; font-family:'IBM Plex Mono', monospace; }

  .reveal{ opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s ease; }
  .reveal.in{ opacity:1; transform:none; }

  /* ---------- mobile ---------- */
  /* overflow-x is scoped to content wrappers, not html/body — putting it on
     body breaks position:sticky on the header in several mobile browsers */
  main, footer{ overflow-x:hidden; }
  @media (max-width:680px){
    body{ font-size:15px; }
    .nav-wrap{ padding:12px 18px; }
    .brand{ font-size:0.95rem; }
    nav.links.open{ padding:14px 18px; }

    .hero-inner{ padding:52px 18px 44px; }
    .eyebrow{ font-size:0.7rem; gap:8px; margin-bottom:14px; }
    h1.name{ margin-bottom:16px; }
    .lede{ font-size:1rem; margin-bottom:24px; }
    .tagrow{ margin-bottom:26px; gap:7px; }
    .tag{ font-size:0.72rem; padding:5px 10px; }
    .contact-row{ gap:10px; }
    .contact-row a{ padding:10px 14px; font-size:0.88rem; flex:1 1 auto; justify-content:center; }

    main{ padding:0 18px; }
    section{ padding:52px 0; }
    .section-head{ margin-bottom:32px; gap:12px; }
    h2.section-title{ font-size:1.5rem; }
    .section-sub{ font-size:0.86rem; }

    .timeline::before{ left:5px; }
    .t-item{ padding-left:26px; padding-bottom:32px; }
    .t-item::before{ width:11px; height:11px; }
    .t-org{ font-size:1.02rem; }
    .t-date{ font-size:0.75rem; }

    .grid-projects{ grid-template-columns:1fr; gap:16px; }
    .card{ padding:18px 18px 16px; }

    .exp-item{ padding:16px 0; }

    .skills-grid{ grid-template-columns:1fr 1fr; gap:22px 20px; }

    .lang-interest{ gap:28px; }

    footer{ padding:44px 18px 32px; }
    footer .contact-row{ flex-direction:column; }
  }
  @media (max-width:400px){
    .skills-grid{ grid-template-columns:1fr; }
    h1.name{ font-size:2.1rem; }
    .brand{ font-size:0.82rem; }
    .nav-tools{ gap:6px; }
    .toggle button{ padding:3px 7px; }
  }

  /* ---------- case studies page ---------- */
  nav.links a.current{ color:var(--ink); border-color:var(--accent); }
  .brand a{ text-decoration:none; }
  .cs-hero-inner{ padding:72px 28px 56px; }
  .cs-back{
    display:inline-flex; align-items:center; gap:6px; margin-bottom:22px;
    font-family:'IBM Plex Mono', monospace; font-size:0.8rem; color:var(--accent); text-decoration:none;
  }
  .cs-back:hover{ text-decoration:underline; }
  .cs-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:20px; }
  a.cs-card{ text-decoration:none; color:inherit; }
  .cs-card .card-kicker{ margin-bottom:2px; }
  .cs-card .card-kicker{ display:flex; justify-content:space-between; align-items:center; }
  .card-arrow{ font-size:1.1rem; color:var(--accent); transition:transform .15s; }
  a.cs-card:hover .card-arrow{ transform:translateX(4px); }

  .cs-section{ padding:56px 0; border-bottom:1px solid var(--line); }
  #csMain > .cs-section:first-child{ padding-top:44px; }
  .cs-section:last-of-type{ border-bottom:none; }
  .cs-section h2{ font-family:'IBM Plex Serif', Georgia, serif; font-weight:600; font-size:1.5rem; margin:0 0 16px; }
  .cs-section > p{ color:var(--ink-soft); max-width:72ch; margin:0 0 12px; }
  .cs-section p strong, .cs-list-plain strong{ color:var(--ink); font-weight:600; }
  .cs-hint{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--ink-faint); margin:0 0 18px; }

  /* expandable fronts */
  .fronts{ display:grid; gap:12px; }
  details.front{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    transition:border-color .15s, box-shadow .15s;
  }
  details.front[open]{ border-color:var(--accent); box-shadow:0 10px 24px var(--shadow); }
  details.front summary{
    list-style:none; cursor:pointer; padding:18px 20px; display:grid;
    grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:start;
  }
  details.front summary::-webkit-details-marker{ display:none; }
  details.front summary:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:12px; }
  .front-num{ font-family:'IBM Plex Mono', monospace; color:var(--accent); font-size:0.85rem; padding-top:2px; }
  .front-title{ font-weight:600; font-size:1.02rem; }
  .front-short{ grid-column:2; color:var(--ink-soft); font-size:0.92rem; }
  .front-toggle{
    grid-row:1 / span 2; grid-column:3; font-family:'IBM Plex Mono', monospace; font-size:0.74rem;
    color:var(--accent); background:var(--accent-glow); border-radius:999px; padding:4px 10px; white-space:nowrap;
  }
  .front-toggle .less{ display:none; }
  details.front[open] .front-toggle .more{ display:none; }
  details.front[open] .front-toggle .less{ display:inline; }
  .front-body{ padding:0 20px 20px 20px; border-top:1px solid var(--line); margin:0 20px; padding-left:0; padding-right:0; }
  .front-body h4{ font-family:'IBM Plex Mono', monospace; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.08em; color:var(--accent); margin:16px 0 6px; }
  .front-body p{ margin:0; color:var(--ink-soft); font-size:0.94rem; max-width:72ch; }

  .cs-steps{ display:flex; align-items:flex-end; gap:8px; }
  .cs-step{ flex:1; height:var(--h, auto); border-radius:10px; padding:12px; background:var(--surface-2); border:1px solid var(--line); font-size:0.84rem; color:var(--ink-soft); }
  .cs-step b{ display:block; color:var(--ink); font-size:0.94rem; margin-bottom:4px; }
  .cs-step:last-child{ border-color:var(--accent); background:var(--accent-glow); }

  .cs-list-plain{ margin:0; padding-left:1.1em; color:var(--ink-soft); max-width:72ch; }
  .cs-list-plain li{ margin-bottom:8px; }
  .cs-list-plain li::marker{ color:var(--accent); }

  .cs-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; }
  .cs-stat{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .cs-stat b{ display:block; font-family:'IBM Plex Serif', Georgia, serif; font-size:1.6rem; color:var(--accent); line-height:1.15; }
  .cs-stat span{ font-size:0.86rem; color:var(--ink-soft); }
  .cs-tags{ display:flex; flex-wrap:wrap; gap:7px; }

  @media (max-width:680px){
    .cs-hero-inner{ padding:44px 18px 36px; }
    .cs-section{ padding:40px 0; }
    .cs-steps{ flex-direction:column; align-items:stretch; }
    .cs-step{ height:auto; }
    details.front summary{ grid-template-columns:auto 1fr; padding:16px; }
    .front-toggle{ grid-row:auto; grid-column:2; justify-self:start; }
    .front-body{ margin:0 16px; }
    .cs-list{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <div class="brand"><a href="index.html">Marina <span class="dot">Sangineto Jucá</span></a></div>
    <nav class="links" id="navLinks">
      <a href="index.html#about" data-i18n="nav.about"></a>
      <a href="index.html#research" data-i18n="nav.research"></a>
      <a href="index.html#projects" data-i18n="nav.projects"></a>
      <a href="case-studies.html" class="current" data-i18n="nav.cases"></a>
      <a href="index.html#experience" data-i18n="nav.experience"></a>
      <a href="index.html#skills" data-i18n="nav.skills"></a>
      <a href="index.html#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-tools">
      <div class="toggle" id="langToggle">
        <button data-lang="en">EN</button>
        <button data-lang="pt">PT</button>
      </div>
      <button class="burger" id="burgerBtn" aria-label="Menu">☰</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="tracks" aria-hidden="true"><svg viewBox="0 0 1200 400" preserveAspectRatio="none">
    <path d="M -50 60 C 250 30, 500 120, 1250 40" />
    <path class="hit" d="M -50 220 C 220 180, 480 260, 760 200 L 1250 180" />
    <path d="M -50 340 C 300 300, 600 360, 900 310 L 1250 330" />
  </svg></div>
  <div class="hero-inner cs-hero-inner" id="heroInner"></div>
</section>

  <div class="contact-row">

<script>
(function(){
  "use strict";

  var I18N = {
    en: {
      "nav.about":"About", "nav.research":"Research", "nav.projects":"Projects", "nav.cases":"Case Studies",
      "nav.experience":"Experience", "nav.skills":"Skills", "nav.contact":"Contact",
      "list.eyebrow":"Case studies",
      "list.title":"Case studies",
      "list.lede":"Detailed write-ups of selected work: the context, what I did, how I did it and what came out of it.",
      "list.open":"Read the case study →",
      "back":"← All case studies",
      "more":"Details +", "less":"Close −",
      "hint":"Click each item to see how it worked in practice.",
      "how":"How it worked", "example":"Example", "role":"My role",
      "footer.home":"← Back to portfolio",
      "footer.note":"© 2026 Marina Sangineto Jucá."
    },
    pt: {
      "nav.about":"Sobre", "nav.research":"Pesquisa", "nav.projects":"Projetos", "nav.cases":"Estudos de Caso",
      "nav.experience":"Experiência", "nav.skills":"Competências", "nav.contact":"Contato",
      "list.eyebrow":"Estudos de caso",
      "list.title":"Estudos de caso",
      "list.lede":"Descrições detalhadas de trabalhos selecionados: o contexto, o que eu fiz, como fiz e o que resultou.",
      "list.open":"Ler o estudo de caso →",
      "back":"← Todos os estudos de caso",
      "more":"Detalhes +", "less":"Fechar −",
      "hint":"Clique em cada item para ver como funcionou na prática.",
      "how":"Como funcionou", "example":"Exemplo", "role":"Meu papel",
      "footer.home":"← Voltar ao portfólio",
      "footer.note":"© 2026 Marina Sangineto Jucá."
    }
  };

  var CASES = [
    {
      id:"agents",
      kicker:{en:"LPNHE / ATLAS – CERN · 2026", pt:"LPNHE / ATLAS – CERN · 2026"},
      title:{en:"Exploring AI agents in ML research", pt:"Explorando agentes de IA em pesquisa de ML"},
      summary:{en:"An exercise in using AI agents to optimize the research workflow of a CERN/ATLAS fast-simulation project: job allocation, contingency-planned tests, debugging, new tooling, structured notes and parallel workstreams.", pt:"Um exercício de uso de agentes de IA para otimizar o fluxo de pesquisa de um projeto de simulação rápida do CERN/ATLAS: alocação de jobs, testes com contingência, depuração, novas ferramentas, notas estruturadas e frentes em paralelo."},
      tags:["Claude Code","Multi-agent","Python","GitHub","HTCondor","Obsidian"],
      sections:[
        {h:{en:"Context", pt:"Contexto"}, p:[
          {en:"Comparing theory with LHC data requires millions of simulated events, and the detector-simulation stages are the most expensive part of that chain. My internship trained a generative model (<strong>CaloDREAM++</strong>, a flow-matching Vision Transformer) as a fast-simulation replacement inside <strong>Lorenzetti</strong>, an open calorimeter-simulation framework. That meant dozens of ML experiments running in parallel on a shared GPU cluster.", pt:"Comparar teoria com os dados do LHC exige milhões de eventos simulados, e as etapas de simulação do detector são a parte mais cara dessa cadeia. No estágio, treinei um modelo generativo (<strong>CaloDREAM++</strong>, um Vision Transformer de flow matching) como simulação rápida dentro do <strong>Lorenzetti</strong>, um framework aberto de simulação de calorímetros. Isso significava dezenas de experimentos de ML rodando em paralelo num cluster de GPUs compartilhado."}
        ]},
        {h:{en:"Where agents were explored", pt:"Onde explorei agentes"}, p:[
          {en:"In the final month of the internship I ran an exercise: exploring how AI agents could optimize the research workflow itself. I applied them where the work was repetitive, well specified and verifiable: <strong>allocating jobs</strong> on the cluster (which could take 2 to 3 days per job, often on worse machines), <strong>fixing and refactoring a large codebase</strong>, and <strong>drafting new code</strong> to review instead of starting from scratch.", pt:"No último mês do estágio fiz um exercício: explorar como agentes de IA podiam otimizar o próprio fluxo de pesquisa. Apliquei agentes onde o trabalho era repetitivo, bem especificado e verificável: <strong>alocação de jobs</strong> no cluster (que podia levar 2 a 3 dias por job, muitas vezes em máquinas piores), <strong>correção e refatoração de um código grande</strong> e <strong>primeiras versões de código novo</strong> para revisar em vez de partir do zero."}
        ]},
        {h:{en:"What the agents did", pt:"O que os agentes fizeram"}, hint:true, fronts:[
          {t:{en:"Job submission & allocation", pt:"Submissão e alocação"},
           s:{en:"Placing the heaviest tests on the best GPUs, including overnight.", pt:"Alocar os testes mais pesados nas melhores GPUs, inclusive de madrugada."},
           how:{en:"Every experiment on the CERN batch system is a submit file plus a script. The agent checked which machines were free, adapted my submission settings to the hardware each run needed, checked the queue and job history for duplicates before submitting, and kept a job log with the status of each run.", pt:"Cada experimento no sistema de batch do CERN é um arquivo de submissão mais um script. O agente verificava quais máquinas estavam livres, adaptava minhas configurações de submissão ao hardware que cada execução precisava, conferia a fila e o histórico para evitar jobs duplicados antes de submeter e mantinha um log com o status de cada execução."},
           ex:{en:"A shape-model run had been matched to a weak GPU with an estimated 400+ hours to finish. The agent spotted that its submit file had no minimum-GPU requirement, added it and resubmitted on adequate hardware.", pt:"Uma execução do modelo de forma tinha caído numa GPU fraca, com previsão de mais de 400 horas. O agente identificou que o arquivo de submissão não tinha requisito mínimo de GPU, adicionou e ressubmeteu em hardware adequado."},
           role:{en:"I defined the submission conventions (batch only, never on login nodes) and which resources each model family needed.", pt:"Eu defini as convenções de submissão (sempre pelo batch, nunca nos nós de login) e quais recursos cada família de modelos precisava."}},
          {t:{en:"Contingency-planned tests", pt:"Testes com contingência"},
           s:{en:"Test campaigns with a pre-defined next step for each outcome.", pt:"Campanhas de teste com o próximo passo definido para cada resultado."},
           how:{en:"Before a campaign, I wrote down the hypotheses for what could go wrong and what to do in each case (“if X, do Y”). The agent submitted the variants, read the results as they arrived and followed the matching branch of the plan, calling me when an outcome fell outside it.", pt:"Antes de cada campanha, eu escrevia as hipóteses do que poderia dar errado e o que fazer em cada caso (“se X, faça Y”). O agente submetia as variantes, lia os resultados conforme chegavam e seguia o ramo correspondente do plano, me chamando quando um resultado fugia dele."},
           ex:{en:"Five candidate fixes for the shape model were launched in parallel, each with a fast reduced-iteration variant to get a same-day signal before the slow full runs finished.", pt:"Cinco correções candidatas para o modelo de forma foram lançadas em paralelo, cada uma com uma variante rápida de menos iterações para ter um sinal no mesmo dia, antes das execuções completas terminarem."},
           role:{en:"The hypotheses and the decision tree were mine; the agent executed and reported.", pt:"As hipóteses e a árvore de decisão eram minhas; o agente executava e reportava."}},
          {t:{en:"Large-codebase debugging", pt:"Depuração em código grande"},
           s:{en:"Finding hardcoded values, wrong references and suspicious logic.", pt:"Encontrar valores fixos, referências erradas e lógica suspeita."},
           how:{en:"The agent searched the codebase for the source of a symptom, proposed a root cause and a fix, and applied it on its own branch. Each fix was validated (a retrain or a small standalone reproduction script) before merging, and registered in the bug registry.", pt:"O agente buscava na base a origem de um sintoma, propunha uma causa e uma correção e aplicava numa branch própria. Cada correção era validada (um retreino ou um pequeno script de reprodução) antes do merge e registrada no registro de bugs."},
           ex:{en:"The energy model failed above 100 GeV (AUC ≈ 0.99). The cause was a sampling range hardcoded to 1 to 100 GeV regardless of the training data. After the fix and retrain, AUC went from 0.99 to 0.49.", pt:"O modelo de energia falhava acima de 100 GeV (AUC ≈ 0,99). A causa era uma faixa de amostragem fixa em 1 a 100 GeV, independente dos dados de treino. Depois da correção e do retreino, o AUC foi de 0,99 para 0,49."},
           role:{en:"I reviewed every proposed root cause and decided which fixes to merge.", pt:"Eu revisava cada causa proposta e decidia quais correções entravam."}},
          {t:{en:"New tooling", pt:"Novas ferramentas"},
           s:{en:"Reviewable first drafts instead of blank files.", pt:"Primeiras versões para revisar em vez de arquivos em branco."},
           how:{en:"For new code I described the goal and the constraints, the agent produced a first structure, and I reviewed and iterated on it. This let side tools move forward in parallel without slowing the main project.", pt:"Para código novo, eu descrevia o objetivo e as restrições, o agente produzia uma primeira estrutura e eu revisava e iterava. Isso permitiu avançar ferramentas paralelas sem atrasar o projeto principal."},
           ex:{en:"Three tools: a simulation-status monitor, an energy-spectrum sampler (linear, log, Fermi-like or custom distributions closer to the physics) and the fast-simulation integration itself.", pt:"Três ferramentas: um monitor de status da simulação, um gerador de espectros de energia (distribuições linear, log, tipo Fermi ou customizadas, mais próximas da física) e a própria integração da simulação rápida."},
           role:{en:"I specified each tool and reviewed the code before it was used.", pt:"Eu especifiquei cada ferramenta e revisei o código antes do uso."}},
          {t:{en:"Structured notes", pt:"Notas estruturadas"},
           s:{en:"An Obsidian vault as the project's memory.", pt:"Um vault no Obsidian como memória do projeto."},
           how:{en:"At the end of each task the agent recorded what it did in a format I defined. The notes worked as a development backlog, as context for every new agent session and as my own reference.", pt:"Ao fim de cada tarefa, o agente registrava o que fez num formato que eu defini. As notas serviam como backlog do desenvolvimento, contexto para cada nova sessão de agente e consulta própria."},
           list:[
             {en:"<strong>Agent log:</strong> one note per session with goal, actions, results, decisions and next steps", pt:"<strong>Log dos agentes:</strong> uma nota por sessão com objetivo, ações, resultados, decisões e próximos passos"},
             {en:"<strong>Projects:</strong> current state of each track, updated in place", pt:"<strong>Projetos:</strong> estado atual de cada frente, atualizado no lugar"},
             {en:"<strong>Diagnostics:</strong> full investigations with root cause and evidence", pt:"<strong>Diagnósticos:</strong> investigações completas com causa e evidências"},
             {en:"<strong>Bug registry:</strong> symptom → root cause → fix → validation", pt:"<strong>Registro de bugs:</strong> sintoma → causa → correção → validação"},
             {en:"<strong>Working agreements:</strong> rules the agent read before acting", pt:"<strong>Acordos de trabalho:</strong> regras que o agente lia antes de agir"}
           ],
           role:{en:"I designed the structure and templates; the vault reached 85 notes and 22 registered bugs.", pt:"Eu desenhei a estrutura e os templates; o vault chegou a 85 notas e 22 bugs registrados."}},
          {t:{en:"Parallel workstreams", pt:"Frentes em paralelo"},
           s:{en:"Several agents, then coordinators supervising groups of agents.", pt:"Vários agentes, depois coordenadores supervisionando grupos de agentes."},
           how:{en:"Independent tracks each had their own agent. Later, a coordinator agent ran daily check-ins across tracks, read the notes, decided routine next steps and flagged to me anything that needed a real decision.", pt:"Cada frente independente tinha seu próprio agente. Depois, um agente coordenador fazia checagens diárias entre as frentes, lia as notas, decidia os próximos passos de rotina e me sinalizava o que precisava de uma decisão de verdade."},
           ex:{en:"Four tracks ran at once: extending the energy model to higher energies, a wider detector region, candidate fixes for the shape model, and a new Z → ee dataset.", pt:"Quatro frentes rodaram ao mesmo tempo: extensão do modelo de energia para energias mais altas, uma região maior do detector, correções candidatas para o modelo de forma e um novo dataset Z → ee."},
           role:{en:"I split the work into tracks that did not depend on each other and set what the coordinator could decide alone.", pt:"Eu dividi o trabalho em frentes que não dependiam umas das outras e defini o que o coordenador podia decidir sozinho."}}
        ]},
        {h:{en:"How my use evolved", pt:"Como meu uso evoluiu"}, steps:[
          {t:"Manual", d:{en:"Approved each edit to learn how the agent behaved", pt:"Aprovava cada alteração para entender o agente"}},
          {t:"Plan", d:{en:"Reviewed the plan before execution", pt:"Revisava o plano antes de executar"}},
          {t:"Auto", d:{en:"Agent ran alone and called me at defined checkpoints", pt:"Agente seguia sozinho e me chamava em pontos definidos"}},
          {t:{en:"Multi-agent", pt:"Multi-agentes"}, d:{en:"Parallel agents on independent tracks", pt:"Agentes em paralelo em frentes independentes"}},
          {t:{en:"Hierarchy", pt:"Hierarquia"}, d:{en:"Agents coordinating groups of agents", pt:"Agentes coordenando grupos de agentes"}}
        ]},
        {h:{en:"Results", pt:"Resultados"}, stats:[
          {b:"AUC ≈ 0.50", s:{en:"energy model, every configuration up to 1 TeV and full detector (0.5 = indistinguishable from full simulation)", pt:"modelo de energia, todas as configurações até 1 TeV e detector completo (0,5 = indistinguível da simulação completa)"}},
          {b:{en:"< 1 day", pt:"< 1 dia"}, s:{en:"to land the right GPU, down from 2 to 3 days", pt:"para conseguir a GPU certa, antes 2 a 3 dias"}},
          {b:"3", s:{en:"new tools shipped alongside the main project", pt:"novas ferramentas entregues junto ao projeto principal"}},
          {b:"22", s:{en:"bugs registered and tracked to root cause", pt:"bugs registrados e rastreados até a causa"}}
        ]}
      ]
    }
  ];

  function t(f, lang){ if (f == null) return ""; if (typeof f === "string") return f; return f[lang] || f.en || ""; }
  function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  var state = { lang:"en" };
  try { var saved = localStorage.getItem("portfolio-lang"); if (saved === "en" || saved === "pt") state.lang = saved; } catch(e){}

  function L(k){ return I18N[state.lang][k] || ""; }

  function applyStatic(){
    document.documentElement.setAttribute("lang", state.lang);
    document.querySelectorAll("[data-i18n]").forEach(function(n){ n.textContent = L(n.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-html]").forEach(function(n){ n.innerHTML = L(n.getAttribute("data-i18n-html")); });
    document.querySelectorAll(".toggle button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-lang") === state.lang); });
  }

  function renderList(){
    var lang = state.lang, hero = document.getElementById("heroInner"), main = document.getElementById("csMain");
    document.title = L("list.title") + " · Marina Sangineto Jucá";
    hero.innerHTML = "";
    hero.appendChild(el("p","eyebrow", L("list.eyebrow")));
    hero.appendChild(el("h1","name", L("list.title")));
    hero.appendChild(el("p","lede", L("list.lede")));
    main.innerHTML = "";
    var sec = el("section","cs-section");
    var grid = el("div","cs-list");
    CASES.forEach(function(c){
      var a = el("a","card cs-card featured");
      a.href = "#" + c.id;
      a.appendChild(el("div","card-kicker", t(c.kicker, lang) + '<span class="card-arrow" aria-hidden="true">→</span>'));
      a.appendChild(el("div","card-title", t(c.title, lang)));
      a.appendChild(el("p", null, t(c.summary, lang)));
      var tags = el("div","card-tags");
      c.tags.forEach(function(x){ tags.appendChild(el("span","chip", x)); });
      a.appendChild(tags);
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    main.appendChild(sec);
  }

  function renderCase(c){
    var lang = state.lang, hero = document.getElementById("heroInner"), main = document.getElementById("csMain");
    document.title = t(c.title, lang) + " · Marina Sangineto Jucá";
    hero.innerHTML = "";
    var back = el("a","cs-back", L("back")); back.href = "case-studies.html";
    hero.appendChild(back);
    hero.appendChild(el("p","eyebrow", t(c.kicker, lang)));
    hero.appendChild(el("h1","name", t(c.title, lang)));
    hero.appendChild(el("p","lede", t(c.summary, lang)));
    var tags = el("div","cs-tags");
    c.tags.forEach(function(x){ tags.appendChild(el("span","tag", x)); });
    hero.appendChild(tags);

    main.innerHTML = "";
    c.sections.forEach(function(s, si){
      var sec = el("section","cs-section");
      var head = el("div","section-head");
      head.appendChild(el("span","section-num mono", (si < 9 ? "0" : "") + (si+1)));
      head.appendChild(el("h2","section-title", t(s.h, lang)));
      sec.appendChild(head);
      (s.p||[]).forEach(function(p){ sec.appendChild(el("p", null, t(p, lang))); });
      if (s.fronts){
        if (s.hint) sec.appendChild(el("p","cs-hint", L("hint")));
        var wrap = el("div","fronts");
        s.fronts.forEach(function(f, i){
          var d = el("details","front");
          var sum = el("summary");
          sum.appendChild(el("span","front-num", "0" + (i+1)));
          sum.appendChild(el("span","front-title", t(f.t, lang)));
          sum.appendChild(el("span","front-toggle", '<span class="more">'+L("more")+'</span><span class="less">'+L("less")+'</span>'));
          sum.appendChild(el("span","front-short", t(f.s, lang)));
          d.appendChild(sum);
          var body = el("div","front-body");
          body.appendChild(el("h4", null, L("how")));
          body.appendChild(el("p", null, t(f.how, lang)));
          if (f.list){
            var ul = el("ul","cs-list-plain"); ul.style.marginTop = "10px";
            f.list.forEach(function(li){ ul.appendChild(el("li", null, t(li, lang))); });
            body.appendChild(ul);
          }
          if (f.ex){ body.appendChild(el("h4", null, L("example"))); body.appendChild(el("p", null, t(f.ex, lang))); }
          if (f.role){ body.appendChild(el("h4", null, L("role"))); body.appendChild(el("p", null, t(f.role, lang))); }
          d.appendChild(body);
          wrap.appendChild(d);
        });
        sec.appendChild(wrap);
      }
      if (s.steps){
        var st = el("div","cs-steps");
        s.steps.forEach(function(x, i){
          var b = el("div","cs-step");
          b.style.setProperty("--h", (122 + i*26) + "px");
          b.appendChild(el("b", null, t(x.t, lang)));
          b.appendChild(document.createTextNode(t(x.d, lang)));
          st.appendChild(b);
        });
        sec.appendChild(st);
      }
      if (s.stats){
        var g = el("div","cs-stats");
        s.stats.forEach(function(x){
          var c2 = el("div","cs-stat");
          c2.appendChild(el("b", null, t(x.b, lang)));
          c2.appendChild(el("span", null, t(x.s, lang)));
          g.appendChild(c2);
        });
        sec.appendChild(g);
      }
      main.appendChild(sec);
    });
  }

  function route(keepScroll){
    applyStatic();
    var id = location.hash.replace("#","");
    var c = CASES.filter(function(x){ return x.id === id; })[0];
    if (c) renderCase(c); else renderList();
    if (!keepScroll) window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", function(){ route(false); });

  document.getElementById("langToggle").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-lang]"); if (!btn) return;
    state.lang = btn.getAttribute("data-lang");
    try { localStorage.setItem("portfolio-lang", state.lang); } catch(err){}
    route(true);
  });
  document.getElementById("burgerBtn").addEventListener("click", function(){ document.getElementById("navLinks").classList.toggle("open"); });

  (function(){
    var header = document.querySelector("header.site"), lastY = window.scrollY, ticking = false;
    function onScroll(){
      var y = window.scrollY, navOpen = document.getElementById("navLinks").classList.contains("open");
      if (navOpen || y <= 72) header.classList.remove("is-hidden");
      else if (y > lastY) header.classList.add("is-hidden");
      else if (y < lastY) header.classList.remove("is-hidden");
      lastY = y; ticking = false;
    }
    window.addEventListener("scroll", function(){ if (!ticking){ requestAnimationFrame(onScroll); ticking = true; } }, {passive:true});
  })();

  route(true);
})();
</script>
